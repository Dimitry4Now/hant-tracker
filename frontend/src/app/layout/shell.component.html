<div class="shell">
  <header class="topbar">
    <a routerLink="/dashboard" class="brand-link"><app-brand /></a>

    <div class="right">
      <nav>
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/analysis" routerLinkActive="active">Analysis</a>
        @if (auth.isAdmin()) {
          <a routerLink="/admin/requests" routerLinkActive="active">Requests</a>
          <a routerLink="/admin/games" routerLinkActive="active">Games</a>
          <a routerLink="/admin/users" routerLinkActive="active">Users</a>
        }
      </nav>
      @if (auth.user(); as user) {
        <div class="user">
          <a routerLink="/account" routerLinkActive="active" class="account-link">{{ user.displayName }}</a>
          <span class="dot">·</span>
          <button type="button" class="logout" (click)="logout()">Log out</button>
        </div>
      }
      <app-theme-toggle />
    </div>
  </header>

  <main>
    <router-outlet />
  </main>
</div>
