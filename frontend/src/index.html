<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hant Stats</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Ornamental deck black joker by nicubunu (public domain, openclipart.org). -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap">

  <!-- Applies the theme before the app boots, so a dark-mode visitor never
       sees a white page first. ThemeService takes over from here and reads the
       same key; keep the two in step. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('hant-theme');
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        /* storage or matchMedia unavailable — the app applies it after boot */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
