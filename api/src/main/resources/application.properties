spring.application.name=api

# Dev by default: in-memory H2 plus seed data, so ./gradlew bootRun needs no
# external services. Run with --spring.profiles.active=prod for PostgreSQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.ttl-hours=12
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Used when an admin creates a player without giving a password.
app.default-password=${DEFAULT_PASSWORD:changeme}
