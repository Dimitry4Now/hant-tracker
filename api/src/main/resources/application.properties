spring.application.name=api

# Dev by default: in-memory H2 plus seed data, so ./gradlew bootRun needs no
# external services. Run with --spring.profiles.active=prod for PostgreSQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.ttl-hours=12
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Used when an admin creates a player without giving a password.
app.default-password=${DEFAULT_PASSWORD:changeme}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only
# checks that the entities still match it. A database Hibernate created
# before Flyway existed is baselined at V1, so only the later scripts run.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Loads a collection for up to this many parents in one query, instead of
# one query per game (players, rounds, round entries, money).
spring.jpa.properties.hibernate.default_batch_fetch_size=100
