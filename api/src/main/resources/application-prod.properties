spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hant_tracker}
spring.datasource.username=${DB_USER:hant_tracker}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

app.seed.enabled=false

# Rolling file log next to the jar's install directory. systemd captures stdout
# as well, so journalctl and these files hold the same lines.
logging.file.name=${LOG_DIR:/opt/hant-tracker/server/logs}/hant-tracker.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_DIR:/opt/hant-tracker/server/logs}/hant-tracker.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Creates the first ADMIN on an empty database, then never touches it again.
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap-admin.name=${ADMIN_NAME:Admin}
