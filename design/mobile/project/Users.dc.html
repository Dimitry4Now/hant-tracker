<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Users — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&amp;family=Work+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Work Sans',system-ui,sans-serif;background:#faf8f4;color:#201f1c;-webkit-font-smoothing:antialiased}
a{color:#2f6f6a;text-decoration:none}a:hover{color:#24574f}
input::placeholder{color:#8a8578}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #faf8f4; display: flex; flex-direction: column;">
  <header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e7e3da; background: #faf8f4;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f6f6a" stroke-width="1.6" aria-hidden="true"><path d="M12 3c-3 3.5-7 6.4-7 10.2 0 2.5 2 4.3 4.3 4.3 1.2 0 2.2-.5 2.7-1.3-.2 1.6-1 2.9-2.4 3.8h4.8c-1.4-.9-2.2-2.2-2.4-3.8.5.8 1.5 1.3 2.7 1.3 2.3 0 4.3-1.8 4.3-4.3C19 9.4 15 6.5 12 3z"></path></svg>
      <span style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 19px;">Hant Stats</span>
    </div>
    <div style="display: flex; align-items: center; gap: 2px;">
      <button type="button" aria-label="Switch to dark theme" style="width: 44px; height: 44px; border: none; background: transparent; color: #201f1c; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
      </button>
      <a href="Account.dc.html" aria-label="Account — Player A" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #e4efed; color: #2f6f6a; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;">PA</span>
      </a>
    </div>
  </header>
  <main style="box-sizing: border-box; padding: 20px 16px 110px; display: flex; flex-direction: column; gap: 16px;">
    <div>
      <h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 28px; line-height: 1.15;">Admin</h1>
    </div>
    <div role="tablist" aria-label="Admin sections" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 10px; background: #efebe3;">
      <a href="Requests.dc.html" role="tab" aria-selected="false" style="height: 36px; border: none; border-radius: 7px; background: transparent; color: #57534a; font-family: inherit; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px;">Requests <span style="min-width: 18px; height: 18px; border-radius: 9px; background: #a15139; color: #ffffff; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;">2</span></a>
      <button type="button" role="tab" aria-selected="true" style="height: 36px; border: none; border-radius: 7px; background: #ffffff; color: #201f1c; font-family: inherit; font-size: 14px; font-weight: 600; box-shadow: 0 1px 2px rgba(32, 31, 28, 0.12); display: flex; align-items: center; justify-content: center; gap: 6px;">Users</button>
    </div>
    <p style="margin: 0 2px; font-size: 13px; color: #6f6a5f;">Everyone with an account · 4 people</p>
    <ul style="list-style: none; margin: 0; padding: 0; background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px; overflow: hidden;">
      <sc-for list="{{users}}" as="u" hint-placeholder-count="4">
        <li style="border-top: {{u.divider}};">
          <a href="{{u.href}}" style="min-height: 68px; box-sizing: border-box; padding: 10px 8px 10px 14px; display: flex; align-items: center; gap: 12px; color: #201f1c;">
            <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: {{u.avatarBg}}; color: {{u.avatarColor}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{u.initials}}</span>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
              <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500;">{{u.name}}
                <sc-if value="{{u.me}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 600; color: #2f6f6a; background: #e4efed; border-radius: 4px; padding: 1px 6px;">You</span></sc-if>
                <sc-if value="{{u.admin}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; color: #57534a; border: 1px solid #e7e3da; border-radius: 4px; padding: 0 6px;">Admin</span></sc-if>
                <sc-if value="{{u.locked}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 600; color: #a15139; background: #f7ebe6; border-radius: 4px; padding: 1px 6px;">Locked</span></sc-if>
              </span>
              <span style="font-size: 13px; color: #6f6a5f; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{u.email}}</span>
            </span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a9a397" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"></path></svg>
          </a>
        </li>
      </sc-for>
    </ul>
  </main>
  <a href="NewUser.dc.html" style="position: absolute; right: 16px; bottom: 92px; height: 52px; padding: 0 20px 0 16px; border-radius: 26px; background: #2f6f6a; color: #faf8f4; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(32, 31, 28, 0.18);">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    New user
  </a>
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; box-sizing: border-box; padding: 6px 8px 18px; background: #ffffff; border-top: 1px solid #e7e3da; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
    <a href="Dashboard.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6f6a5f; font-size: 11px; position: relative;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>
      Dashboard
    </a>
    <a href="Analysis.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6f6a5f; font-size: 11px; position: relative;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"></path></svg>
      Analysis
    </a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6f6a5f; font-size: 11px; position: relative;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="11" height="15" rx="2" transform="rotate(-8 9 13.5)"></rect><rect x="9.5" y="3" width="11" height="15" rx="2" transform="rotate(8 15 10.5)"></rect></svg>
      Games
    </a>
    <a href="Requests.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #2f6f6a; font-size: 11px; font-weight: 600; position: relative;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21 20c0-2.6-1.6-4.6-4-5.3"></path></svg>
      Admin
      <span aria-label="2 pending requests" style="position: absolute; top: 4px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: #a15139; color: #ffffff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center;">2</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const users = [
      { name: 'Player A', email: 'playera@example.com', initials: 'PA', me: true, admin: true, locked: false, href: 'Account.dc.html' },
      { name: 'Player B', email: 'playerb@example.com', initials: 'PB', me: false, admin: false, locked: false, href: 'UserActions.dc.html' },
      { name: 'Player C', email: 'playerc@example.com', initials: 'PC', me: false, admin: false, locked: false, href: 'UserActions.dc.html' },
      { name: 'Player D', email: 'playerd@example.com', initials: 'PD', me: false, admin: false, locked: true, href: 'UserActions.dc.html' }
    ].map((u, i) => Object.assign(u, {
      divider: i === 0 ? 'none' : '1px solid #efebe3',
      avatarBg: u.locked ? '#f3e6e1' : '#e4efed', avatarColor: u.locked ? '#a15139' : '#2f6f6a'
    }));
    return { users };
  }
}
</script>
</body>
</html>
