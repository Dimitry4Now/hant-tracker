<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>User actions — mobile sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&amp;family=Work+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Work Sans',system-ui,sans-serif;background:#faf8f4;color:#201f1c;-webkit-font-smoothing:antialiased}
a{color:#2f6f6a;text-decoration:none}a:hover{color:#24574f}
input::placeholder{color:#8a8578}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #faf8f4; display: flex; flex-direction: column;">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 76px 16px 0; display: flex; flex-direction: column; gap: 12px;">
    <div style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 28px;">Admin</div>
    <div style="height: 64px; border-radius: 12px; background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px;"></div>
    <div style="height: 300px; border-radius: 12px; background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px;"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(32, 31, 28, 0.42);"></div>
  <form role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 300px; margin: 0; background: #faf8f4; border-radius: 18px 18px 0 0; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding-top: 8px;"><span style="width: 40px; height: 5px; border-radius: 3px; background: #d9d4c9;"></span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 4px 20px;">
      <h2 id="sheet-title" style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 22px;">Player B</h2>
      <a href="Users.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #201f1c;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>
    <div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span aria-hidden="true" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; background: #e4efed; color: #2f6f6a; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center;">PB</span>
        <div>
          <div style="font-size: 13px; color: #6f6a5f;">playerb@example.com</div>
          <div style="display: flex; gap: 6px; margin-top: 4px;">
            <span style="font-size: 11px; color: #57534a; border: 1px solid #e7e3da; border-radius: 4px; padding: 1px 6px;">User</span>
            <span style="font-size: 11px; font-weight: 600; color: #2f6f6a; background: #e4efed; border-radius: 4px; padding: 1px 6px;">Active</span>
            <span style="font-size: 11px; color: #6f6a5f; padding: 1px 0;">joined 19 Sept 2024</span>
          </div>
        </div>
      </div>
      <div style="background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px; overflow: hidden;">
        <button type="button" style="width: 100%; min-height: 60px; box-sizing: border-box; padding: 8px 14px; border: none; border-top: none; background: transparent; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 14px; color: #201f1c;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg>
          <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 500;">Rename</span><span style="font-size: 12px; color: #6f6a5f;">Currently “Player B”</span></span>
        </button>
        <button type="button" style="width: 100%; min-height: 60px; box-sizing: border-box; padding: 8px 14px; border: none; border-top: 1px solid #efebe3; background: transparent; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 14px; color: #201f1c;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
          <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 500;">Change email</span><span style="font-size: 12px; color: #6f6a5f;">playerb@example.com</span></span>
        </button>
        <button type="button" style="width: 100%; min-height: 60px; box-sizing: border-box; padding: 8px 14px; border: none; border-top: 1px solid #efebe3; background: transparent; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 14px; color: #201f1c;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3"></path></svg>
          <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 500;">Reset password</span><span style="font-size: 12px; color: #6f6a5f;">Sends a reset to their email</span></span>
        </button>
        <button type="button" style="width: 100%; min-height: 60px; box-sizing: border-box; padding: 8px 14px; border: none; border-top: 1px solid #efebe3; background: transparent; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 14px; color: #a15139;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 500;">Lock account</span><span style="font-size: 12px; color: #6f6a5f;">They can’t log in until unlocked</span></span>
        </button>
      </div>
      <a href="Users.dc.html" style="height: 52px; border-radius: 10px; border: 1px solid #e7e3da; background: #ffffff; color: #201f1c; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; margin-bottom: 28px;">Cancel</a>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>

</html>
