<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analysis — game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&amp;family=Work+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Work Sans',system-ui,sans-serif;background:#faf8f4;color:#201f1c;-webkit-font-smoothing:antialiased}
a{color:#2f6f6a;text-decoration:none}a:hover{color:#24574f}
input::placeholder{color:#8a8578}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #faf8f4; display: flex; flex-direction: column;">
  <header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #e7e3da;">
    <a href="Analysis.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #201f1c;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex-grow: 1; min-width: 0;">
      <div style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 18px; line-height: 1.2;">10 Sept 2026</div>
      <div style="font-size: 12px; color: #6f6a5f;">Game 1 of 2 that day</div>
    </div>
  </header>
  <main style="box-sizing: border-box; padding: 16px 16px 110px; display: flex; flex-direction: column; gap: 14px;">
    <section aria-label="Result" style="background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px; overflow: hidden;">
      <div style="padding: 16px 16px 12px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #2f6f6a; background: #e4efed; border-radius: 4px; padding: 3px 7px;">Majstorska</span>
          <span style="font-size: 13px; color: #6f6a5f;">17 rounds played</span>
        </div>
        <h1 style="margin: 8px 0 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 26px; line-height: 1.15;">Player C won</h1>
      </div>
      <div style="display: grid; grid-template-columns: 36px minmax(0, 1fr) 72px 64px; padding: 0 16px 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6f6a5f;">
        <span></span><span>Player</span><span style="text-align: right;">Points</span><span style="text-align: right;">Result</span>
      </div>
      <ol style="list-style: none; margin: 0; padding: 0;">
        <sc-for list="{{standings}}" as="s" hint-placeholder-count="4">
          <li style="display: grid; grid-template-columns: 36px minmax(0, 1fr) 72px 64px; align-items: center; height: 52px; padding: 0 16px; border-top: 1px solid #efebe3;">
            <span style="width: 24px; height: 24px; border-radius: 12px; background: {{s.rankBg}}; color: {{s.rankColor}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{s.place}}</span>
            <span style="font-size: 15px; font-weight: {{s.weight}};">{{s.name}}</span>
            <span style="text-align: right; font-size: 15px; font-variant-numeric: tabular-nums; font-weight: {{s.weight}};">{{s.points}}</span>
            <span style="text-align: right; font-size: 13px; color: {{s.resultColor}};">{{s.result}}</span>
          </li>
        </sc-for>
      </ol>
    </section>

    <div style="background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px; padding: 12px 16px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6f6a5f; margin-bottom: 4px;">Session note</div>
      <p style="margin: 0; font-size: 14px; line-height: 1.45;">Great Majstorska finish — Player C closed it out with a clean Hant.</p>
    </div>

    <a href="GameDone.dc.html" style="background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px; min-height: 56px; box-sizing: border-box; padding: 0 10px 0 16px; display: flex; align-items: center; gap: 12px; color: #201f1c; font-size: 15px;">
      <span style="flex-grow: 1;">Open the score sheet</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a9a397" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </main>

  <nav aria-label="Other games" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 16px 24px; background: #ffffff; border-top: 1px solid #e7e3da; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
    <a href="AnalysisGame.dc.html" style="height: 52px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #e7e3da; color: #201f1c; display: flex; align-items: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      <span style="display: flex; flex-direction: column;"><span style="font-size: 11px; color: #6f6a5f;">Newer</span><span style="font-size: 14px; font-weight: 500;">17 Sept</span></span>
    </a>
    <a href="AnalysisGame.dc.html" style="height: 52px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #e7e3da; color: #201f1c; display: flex; align-items: center; justify-content: flex-end; gap: 8px; text-align: right;">
      <span style="display: flex; flex-direction: column;"><span style="font-size: 11px; color: #6f6a5f;">Older</span><span style="font-size: 14px; font-weight: 500;">10 Sept · Game 2</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const standings = [['Player C', 630, 'Winner'], ['Player A', 740, '2nd'], ['Player B', 1320, '3rd'], ['Player D', 1370, '4th']]
      .map(([name, pts, result], i) => ({
        place: String(i + 1), name, result, points: '+' + pts.toLocaleString('en-GB'),
        weight: i === 0 ? '600' : '400',
        resultColor: i === 0 ? '#2f6f6a' : '#6f6a5f',
        rankBg: i === 0 ? '#2f6f6a' : '#efebe3', rankColor: i === 0 ? '#faf8f4' : '#57534a'
      }));
    return { standings };
  }
}
</script>
</body>
</html>
