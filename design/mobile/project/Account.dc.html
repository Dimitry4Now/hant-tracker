<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&amp;family=Work+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Work Sans',system-ui,sans-serif;background:#faf8f4;color:#201f1c;-webkit-font-smoothing:antialiased}
a{color:#2f6f6a;text-decoration:none}a:hover{color:#24574f}
input::placeholder{color:#8a8578}
</style>
</helmet>
<div style="width: 390px; height: 1240px; position: relative; overflow: hidden; background: #faf8f4; display: flex; flex-direction: column;">
  <header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #e7e3da;">
    <a href="Dashboard.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #201f1c;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex-grow: 1; min-width: 0;">
      <div style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 18px; line-height: 1.2;">Account</div>
      <div style="font-size: 12px; color: #6f6a5f;">Your name, email and password</div>
    </div>
  </header>
  <main style="box-sizing: border-box; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <span aria-hidden="true" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; background: #e4efed; color: #2f6f6a; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center;">PA</span>
      <div>
        <div style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 22px;">Player A</div>
        <div style="font-size: 13px; color: #6f6a5f;">Admin · joined 19 Sept 2024</div>
      </div>
    </div>

    <form aria-labelledby="profile-title" style="background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; margin: 0;">
      <div>
        <h2 id="profile-title" style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 17px;">Profile</h2>
        <p style="margin: 2px 0 0; font-size: 12px; color: #6f6a5f;">Your display name is what others see on the leaderboard</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="display-name" style="font-size: 13px; font-weight: 500; color: #57534a;">Display name</label>
        <input id="display-name" type="text" value="Player A" autocomplete="nickname" style="height: 48px; box-sizing: border-box; border-radius: 8px; border: 1px solid #cdc7ba; background: #ffffff; padding: 0 12px; font-family: inherit; font-size: 16px; color: #201f1c;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="email" style="font-size: 13px; font-weight: 500; color: #57534a;">Email</label>
        <input id="email" type="email" value="playera@example.com" autocomplete="email" style="height: 48px; box-sizing: border-box; border-radius: 8px; border: 1px solid #cdc7ba; background: #ffffff; padding: 0 12px; font-family: inherit; font-size: 16px; color: #201f1c;">
      </div>
      <button type="submit" style="height: 48px; border: 1px solid #2f6f6a; border-radius: 8px; background: transparent; color: #2f6f6a; font-family: inherit; font-size: 15px; font-weight: 600;">Save profile</button>
    </form>

    <form aria-labelledby="password-title" style="background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; margin: 0;">
      <div>
        <h2 id="password-title" style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 17px;">Password</h2>
        <p style="margin: 2px 0 0; font-size: 12px; color: #6f6a5f;">At least 8 characters</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="current-password" style="font-size: 13px; font-weight: 500; color: #57534a;">Current password</label>
        <input id="current-password" type="password" autocomplete="current-password" style="height: 48px; box-sizing: border-box; border-radius: 8px; border: 1px solid #cdc7ba; background: #ffffff; padding: 0 12px; font-family: inherit; font-size: 16px; color: #201f1c;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="new-password" style="font-size: 13px; font-weight: 500; color: #57534a;">New password</label>
        <input id="new-password" type="password" autocomplete="new-password" style="height: 48px; box-sizing: border-box; border-radius: 8px; border: 1px solid #cdc7ba; background: #ffffff; padding: 0 12px; font-family: inherit; font-size: 16px; color: #201f1c;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="confirm-password" style="font-size: 13px; font-weight: 500; color: #57534a;">Confirm new password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" style="height: 48px; box-sizing: border-box; border-radius: 8px; border: 1px solid #cdc7ba; background: #ffffff; padding: 0 12px; font-family: inherit; font-size: 16px; color: #201f1c;">
      </div>
      <button type="submit" style="height: 48px; border: 1px solid #2f6f6a; border-radius: 8px; background: transparent; color: #2f6f6a; font-family: inherit; font-size: 15px; font-weight: 600;">Change password</button>
    </form>

    <div style="background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px; overflow: hidden;">
      <label style="min-height: 56px; box-sizing: border-box; padding: 8px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
        <span style="flex-grow: 1; font-size: 15px;">Dark theme</span>
        <input type="checkbox" role="switch" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
        <span aria-hidden="true" style="width: 46px; height: 28px; border-radius: 14px; background: #d9d4c9; position: relative; flex-shrink: 0;"><span style="position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.2);"></span></span>
      </label>
      <button type="button" style="width: 100%; min-height: 56px; box-sizing: border-box; padding: 8px 14px; border: none; border-top: 1px solid #efebe3; background: transparent; font-family: inherit; font-size: 15px; color: #a15139; text-align: left; display: flex; align-items: center; gap: 12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path><path d="M9 8l-4 4 4 4M5 12h11"></path></svg>
        Log out
      </button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 1240}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
