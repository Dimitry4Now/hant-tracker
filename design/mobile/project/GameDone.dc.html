<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finished game — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&amp;family=Work+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Work Sans',system-ui,sans-serif;background:#faf8f4;color:#201f1c;-webkit-font-smoothing:antialiased}
a{color:#2f6f6a;text-decoration:none}a:hover{color:#24574f}
</style>
</helmet>
<div style="width: 390px; height: 1180px; position: relative; overflow: hidden; background: #faf8f4; display: flex; flex-direction: column;">

  <!-- App bar -->
  <header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #e7e3da;">
    <a href="Main.dc.html" aria-label="Back to games" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #201f1c;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex-grow: 1; min-width: 0;">
      <div style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 18px; line-height: 1.2;">10 Sept 2026</div>
      <div style="font-size: 12px; color: #6f6a5f;">Game 1 of 2 that day</div>
    </div>
    <button type="button" aria-label="Game options: edit or delete" style="width: 44px; height: 44px; border: none; background: transparent; color: #201f1c; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
    </button>
  </header>

  <div style="box-sizing: border-box; padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 14px;">

    <!-- Result -->
    <section aria-label="Result" style="background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px; overflow: hidden;">
      <div style="padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #2f6f6a; background: #e4efed; border-radius: 4px; padding: 3px 7px;">Majstorska</span>
          <span style="font-size: 13px; color: #6f6a5f;">17 rounds</span>
        </div>
        <h1 style="margin: 4px 0 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 26px; line-height: 1.15;">Player C won</h1>
      </div>
      <ol style="list-style: none; margin: 0; padding: 0;">
        <sc-for list="{{standings}}" as="s" hint-placeholder-count="4">
          <li style="height: 48px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #efebe3;">
            <span style="width: 24px; font-size: 13px; color: #6f6a5f; font-variant-numeric: tabular-nums;">{{s.place}}</span>
            <span style="flex-grow: 1; font-size: 15px; font-weight: {{s.weight}};">{{s.name}}</span>
            <span style="font-size: 15px; font-weight: {{s.weight}}; font-variant-numeric: tabular-nums; color: {{s.color}};">{{s.total}}</span>
          </li>
        </sc-for>
      </ol>
    </section>

    <div style="background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px; padding: 12px 16px; display: flex; gap: 10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6f6a5f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="M5 4h14v12l-4 4H5z"></path><path d="M15 20v-4h4"></path></svg>
      <p style="margin: 0; font-size: 14px; line-height: 1.45;">Great Majstorska finish — Player C closed it out with a clean Hant.</p>
    </div>

    <!-- Section switch -->
    <div role="tablist" aria-label="Game sections" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 10px; background: #efebe3; margin-top: 4px;">
      <a href="GameLive.dc.html" role="tab" aria-selected="false" style="height: 36px; border-radius: 7px; color: #57534a; font-size: 14px; display: flex; align-items: center; justify-content: center;">Sheet</a>
      <button type="button" role="tab" aria-selected="true" style="height: 36px; border: none; border-radius: 7px; background: #ffffff; color: #201f1c; font-family: inherit; font-size: 14px; font-weight: 600; box-shadow: 0 1px 2px rgba(32, 31, 28, 0.12);">Money</button>
      <button type="button" role="tab" aria-selected="false" style="height: 36px; border: none; border-radius: 7px; background: transparent; color: #57534a; font-family: inherit; font-size: 14px;">Details</button>
    </div>

    <!-- Money -->
    <section aria-labelledby="money-title" style="display: flex; flex-direction: column; gap: 8px;">
      <div style="padding: 0 2px;">
        <h2 id="money-title" style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 17px;">Money for this game</h2>
        <p style="margin: 2px 0 0; font-size: 12px; color: #6f6a5f; line-height: 1.45;">Settled by hand, in whole denars. Euro is for reference.</p>
      </div>
      <div style="background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px; overflow: hidden;">
        <sc-for list="{{money}}" as="m" hint-placeholder-count="4">
          <div style="min-height: 68px; box-sizing: border-box; padding: 10px 14px; display: flex; align-items: center; gap: 12px; border-top: {{m.divider}};">
            <label for="{{m.id}}" style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 15px; font-weight: 500;">{{m.name}}</span>
              <span style="font-size: 12px; color: #6f6a5f; font-variant-numeric: tabular-nums;">≈ {{m.eur}}</span>
            </label>
            <div style="display: flex; align-items: center; height: 48px; box-sizing: border-box; border-radius: 8px; border: 1px solid #cdc7ba; background: #faf8f4; overflow: hidden;">
              <input id="{{m.id}}" type="text" inputmode="numeric" value="{{m.den}}" style="width: 84px; height: 46px; box-sizing: border-box; border: none; background: transparent; padding: 0 8px 0 12px; text-align: right; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 19px; color: {{m.color}}; font-variant-numeric: tabular-nums;">
              <span style="padding-right: 12px; font-size: 13px; color: #6f6a5f;">ден</span>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; padding: 0 2px; font-size: 12px; color: #2f6f6a;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        Amounts add up to 0 ден
      </div>
    </section>
  </div>

  <!-- Sticky save -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 24px; background: #ffffff; border-top: 1px solid #e7e3da; box-shadow: 0 -4px 14px rgba(32, 31, 28, 0.06);">
    <button type="button" style="width: 100%; height: 52px; border: none; border-radius: 10px; background: #2f6f6a; color: #faf8f4; font-family: inherit; font-size: 16px; font-weight: 600;">Save amounts</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const standings = [
      ['1', 'Player C', 630],
      ['2', 'Player A', 740],
      ['3', 'Player B', 1320],
      ['4', 'Player D', 1370]
    ].map(([place, name, total], i) => ({
      place, name, total: String(total),
      weight: i === 0 ? '600' : '400',
      color: i === 0 ? '#2f6f6a' : '#201f1c'
    }));
    const eur = (den) => {
      const v = den / 61.5;
      return (v < 0 ? '−€' : '€') + Math.abs(v).toFixed(2);
    };
    const money = [['Player A', -50], ['Player B', -50], ['Player C', 150], ['Player D', -50]].map(([name, den], i) => ({
      id: 'money-' + i, name,
      den: den < 0 ? '−' + Math.abs(den) : '+' + den,
      eur: eur(den),
      color: den < 0 ? '#a15139' : '#2f6f6a',
      divider: i === 0 ? 'none' : '1px solid #efebe3'
    }));
    return { standings, money };
  }
}
</script>
</body>
</html>
