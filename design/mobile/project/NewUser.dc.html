<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New user — mobile sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&amp;family=Work+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Work Sans',system-ui,sans-serif;background:#faf8f4;color:#201f1c;-webkit-font-smoothing:antialiased}
a{color:#2f6f6a;text-decoration:none}a:hover{color:#24574f}
input::placeholder{color:#8a8578}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #faf8f4; display: flex; flex-direction: column;">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 76px 16px 0; display: flex; flex-direction: column; gap: 12px;">
    <div style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 28px;">Admin</div>
    <div style="height: 64px; border-radius: 12px; background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px;"></div>
    <div style="height: 300px; border-radius: 12px; background: #ffffff; border: 1px solid #e7e3da; border-radius: 12px;"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(32, 31, 28, 0.42);"></div>
  <form role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 150px; margin: 0; background: #faf8f4; border-radius: 18px 18px 0 0; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding-top: 8px;"><span style="width: 40px; height: 5px; border-radius: 3px; background: #d9d4c9;"></span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 4px 20px;">
      <h2 id="sheet-title" style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 22px;">New user</h2>
      <a href="Users.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #201f1c;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>
    <div style="flex-grow: 1; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 16px;">
      <p style="margin: 0; font-size: 13px; color: #6f6a5f; line-height: 1.45;">Created active — no approval step, since you're adding them yourself.</p>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="full-name" style="font-size: 13px; font-weight: 500; color: #57534a;">Full name</label>
        <input id="full-name" type="text" autocomplete="name" style="height: 48px; box-sizing: border-box; border-radius: 8px; border: 1px solid #cdc7ba; background: #ffffff; padding: 0 12px; font-family: inherit; font-size: 16px; color: #201f1c;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="display-name" style="font-size: 13px; font-weight: 500; color: #57534a;">Display name <span style="font-weight: 400; color: #6f6a5f;">· shown on the leaderboard</span></label>
        <input id="display-name" type="text" style="height: 48px; box-sizing: border-box; border-radius: 8px; border: 1px solid #cdc7ba; background: #ffffff; padding: 0 12px; font-family: inherit; font-size: 16px; color: #201f1c;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="email" style="font-size: 13px; font-weight: 500; color: #57534a;">Email</label>
        <input id="email" type="email" autocomplete="email" style="height: 48px; box-sizing: border-box; border-radius: 8px; border: 1px solid #cdc7ba; background: #ffffff; padding: 0 12px; font-family: inherit; font-size: 16px; color: #201f1c;">
      </div>
      <fieldset style="border: none; margin: 0; padding: 0;">
        <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: #57534a;">Role</legend>
        <div role="radiogroup" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 10px; background: #efebe3;">
          <button type="button" role="radio" aria-checked="true" style="height: 40px; border: none; border-radius: 7px; background: #ffffff; color: #201f1c; font-family: inherit; font-size: 14px; font-weight: 600; box-shadow: 0 1px 2px rgba(32, 31, 28, 0.12);">User</button>
          <button type="button" role="radio" aria-checked="false" style="height: 40px; border: none; border-radius: 7px; background: transparent; color: #57534a; font-family: inherit; font-size: 14px;">Admin</button>
        </div>
      </fieldset>
    </div>
    <div style="padding: 16px 20px 28px;">
      <a href="Users.dc.html" style="width: 100%; height: 52px; border: none; border-radius: 10px; background: #2f6f6a; color: #faf8f4; font-family: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">Create user</a>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
