<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Work+Sans:wght@400;500;600&family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
  body { margin: 0; }
  a { text-decoration: underline; }
  a:hover { opacity: 0.8; }
</style>
</helmet>
<div style="width:100%;min-height:100%;box-sizing:border-box;background:{{tokens.bg}};font-family:{{tokens.bodyFont}};color:{{tokens.text}};padding:28px;">

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{tokens.accent}}" stroke-width="1.6"><path d="M12 3c-3 3.5-7 6.4-7 10.2 0 2.5 2 4.3 4.3 4.3 1.2 0 2.2-.5 2.7-1.3-.2 1.6-1 2.9-2.4 3.8h4.8c-1.4-.9-2.2-2.2-2.4-3.8.5.8 1.5 1.3 2.7 1.3 2.3 0 4.3-1.8 4.3-4.3C19 9.4 15 6.5 12 3z"></path></svg>
      <span style="font-family:{{tokens.headingFont}};font-weight:700;font-size:18px;">Hant Stats</span>
    </div>
    <div style="display:flex;align-items:center;gap:22px;">
      <div style="display:flex;gap:18px;font-size:13px;color:{{tokens.muted}};">
        <span>Dashboard</span>
        <span>Analysis</span>
        <span style="color:{{tokens.accent}};font-weight:600;">Requests</span>
        <span>Games</span>
        <span>Users</span>
      </div>
      <div onClick="{{toggle}}" style="cursor:pointer;width:34px;height:34px;border-radius:6px;border:1px solid {{tokens.border}};display:flex;align-items:center;justify-content:center;color:{{tokens.text}};flex-shrink:0;">
        <sc-if value="{{dark}}" hint-placeholder-val="{{true}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
        </sc-if>
        <sc-if value="{{notDark}}" hint-placeholder-val="{{true}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"></path></svg>
        </sc-if>
      </div>
    </div>
  </div>

  <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:18px;">
    <span style="font-family:{{tokens.headingFont}};font-weight:700;font-size:20px;">Pending approvals</span>
    <span style="font-size:12px;color:{{tokens.accent}};background:{{tokens.surface}};border:1px solid {{tokens.border}};border-radius:12px;padding:2px 10px;">3</span>
  </div>

  <div style="background:{{tokens.surface}};border:1px solid {{tokens.border}};border-radius:8px;padding:16px;">
    <div style="display:grid;grid-template-columns:2fr 2.4fr 1.2fr 1.6fr;">
      <div style="font-size:11px;text-transform:uppercase;color:{{tokens.muted}};padding-bottom:8px;border-bottom:1px solid {{tokens.border}};">Name</div>
      <div style="font-size:11px;text-transform:uppercase;color:{{tokens.muted}};padding-bottom:8px;border-bottom:1px solid {{tokens.border}};">Email</div>
      <div style="font-size:11px;text-transform:uppercase;color:{{tokens.muted}};padding-bottom:8px;border-bottom:1px solid {{tokens.border}};">Requested</div>
      <div style="font-size:11px;text-transform:uppercase;color:{{tokens.muted}};padding-bottom:8px;border-bottom:1px solid {{tokens.border}};">Actions</div>

      <div style="font-size:13px;padding:12px 0;border-bottom:1px solid {{tokens.border}};">Marko P.</div>
      <div style="font-size:13px;padding:12px 0;border-bottom:1px solid {{tokens.border}};color:{{tokens.muted}};">marko@example.com</div>
      <div style="font-size:13px;padding:12px 0;border-bottom:1px solid {{tokens.border}};color:{{tokens.muted}};">2 days ago</div>
      <div style="padding:10px 0;border-bottom:1px solid {{tokens.border}};display:flex;gap:8px;">
        <button style="height:30px;padding:0 12px;border-radius:5px;border:none;background:{{tokens.accent}};color:{{tokens.bg}};font-size:12px;font-weight:600;cursor:pointer;">Approve</button>
        <button style="height:30px;padding:0 12px;border-radius:5px;border:1px solid {{tokens.negative}};background:transparent;color:{{tokens.negative}};font-size:12px;font-weight:600;cursor:pointer;">Reject</button>
      </div>

      <div style="font-size:13px;padding:12px 0;border-bottom:1px solid {{tokens.border}};">Ivana K.</div>
      <div style="font-size:13px;padding:12px 0;border-bottom:1px solid {{tokens.border}};color:{{tokens.muted}};">ivana@example.com</div>
      <div style="font-size:13px;padding:12px 0;border-bottom:1px solid {{tokens.border}};color:{{tokens.muted}};">5 hours ago</div>
      <div style="padding:10px 0;border-bottom:1px solid {{tokens.border}};display:flex;gap:8px;">
        <button style="height:30px;padding:0 12px;border-radius:5px;border:none;background:{{tokens.accent}};color:{{tokens.bg}};font-size:12px;font-weight:600;cursor:pointer;">Approve</button>
        <button style="height:30px;padding:0 12px;border-radius:5px;border:1px solid {{tokens.negative}};background:transparent;color:{{tokens.negative}};font-size:12px;font-weight:600;cursor:pointer;">Reject</button>
      </div>

      <div style="font-size:13px;padding:12px 0;">Petar S.</div>
      <div style="font-size:13px;padding:12px 0;color:{{tokens.muted}};">petar@example.com</div>
      <div style="font-size:13px;padding:12px 0;color:{{tokens.muted}};">1 week ago</div>
      <div style="padding:10px 0;display:flex;gap:8px;">
        <button style="height:30px;padding:0 12px;border-radius:5px;border:none;background:{{tokens.accent}};color:{{tokens.bg}};font-size:12px;font-weight:600;cursor:pointer;">Approve</button>
        <button style="height:30px;padding:0 12px;border-radius:5px;border:1px solid {{tokens.negative}};background:transparent;color:{{tokens.negative}};font-size:12px;font-weight:600;cursor:pointer;">Reject</button>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dark: false };
  }
  renderVals() {
    const dark = this.state.dark;
    const tokens = dark ? {
      bg: '#16302a', surface: '#1c3a33', border: '#2a4c44',
      text: '#f3ead9', muted: '#7fa89e', accent: '#d4af37', negative: '#c9707f',
      headingFont: "'Bricolage Grotesque',sans-serif", bodyFont: "'Public Sans',sans-serif"
    } : {
      bg: '#faf8f4', surface: '#ffffff', border: '#e7e3da',
      text: '#201f1c', muted: '#8a8578', accent: '#2f6f6a', negative: '#a15139',
      headingFont: "'Source Serif 4',serif", bodyFont: "'Work Sans',sans-serif"
    };
    return { tokens, dark, notDark: !dark, toggle: () => this.setState({ dark: !this.state.dark }) };
  }
}
</script>
</body>
</html>
